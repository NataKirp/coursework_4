{% extends 'base.html' %}
{% block title %}Удалить сообщение{% endblock %}
{% block content %}
<h1 class="h3 mb-4">Удалить сообщение?</h1>
<div class="card p-4" style="max-width:640px">
    <p>Вы собираетесь удалить <strong>«{{ object.subject }}»</strong>.</p>
    <form method="post" class="d-flex gap-2">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'mailing:message_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
