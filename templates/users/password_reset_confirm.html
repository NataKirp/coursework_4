{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="h4 text-center mb-4">Новый пароль</h2>
                {% if validlink %}
                    <form method="post">
                        {% csrf_token %}
                        {% for field in form %}
                            <div class="mb-3">
                                <label class="form-label">{{ field.label }}</label>
                                {{ field }}
                            </div>
                        {% endfor %}
                        <button type="submit" class="btn btn-success w-100 mt-3">Сохранить пароль</button>
                    </form>
                {% else %}
                    <div class="alert alert-danger">Ссылка недействительна или устарела.</div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
